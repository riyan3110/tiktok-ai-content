name: Source Filter Neutral Title Fix
on:
  push:
    branches:
      - 'fix/source-filter-neutral-titles'
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node scripts/apply-source-filter-fix.js
      - run: npm run check
      - run: node --test test/source-filter.test.js
      - run: git diff --check
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/sourceFilter.js
          git commit -m 'fix: stop over-validating neutral source titles'
          git push origin HEAD:fix/source-filter-neutral-titles
