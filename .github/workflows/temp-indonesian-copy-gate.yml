name: Temp Indonesian copy gate

on:
  push:
    branches:
      - fix/indonesian-visible-copy-source

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/indonesian-visible-copy-source
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/apply-indonesian-visible-copy-gate.py
      - name: Persist branch-only code patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/sourceFilter.js test/source-filter-production-regressions.test.js
          git commit -m "fix: keep source-backed visible copy in Indonesian [skip ci]"
          git push origin HEAD:fix/indonesian-visible-copy-source
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: git diff --check
