name: temp-text-grounding-final
on:
  push:
    branches: [agent/text-grounding-final]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/text-grounding-final
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/services/textInputComposer.js')
          s=p.read_text()
          def r(a,b):
              global s
              assert a in s, a[:120]
              s=s.replace(a,b,1)
          r("'efisiensi', 'produktivitas', 'kunci', 'menegaskan', 'mengklaim'", "'efisiensi', 'produktivitas', 'kunci', 'menegaskan', 'mengklaim',\n  'dibuat', 'dirancang', 'cocok', 'mendukung', 'ditujukan', 'bertujuan'")
          r("  'ringkasan'\n];", "  'ringkasan',\n  'kecepatan utama', 'kemampuan utama', 'manfaat utama', 'aplikasi utama',\n  'fokus utama', 'dampak utama', 'informasi utama'\n];")
          anchor="function validateEntityContext(result, sourceText) {"
          helper="""function validateModeSubjectShift(result, sourceText) {\n  const source = normalized(sourceText);\n  const visible = normalized([result?.caption, ...(result?.slides || []).flatMap(slide => [slide?.title, slide?.body, ...(slide?.points || [])])].join(' '));\n  const relation = '(?:ditujukan|dirancang|dibuat|bertujuan)';\n  if (new RegExp(`\\\\bmode (?:ini|tersebut) ${relation}\\\\b`, 'i').test(visible) && !new RegExp(`\\\\bmode (?:ini|tersebut) ${relation}\\\\b`, 'i').test(source)) {\n    return ['subjek relasi berubah: jangan mengubah fakta tentang peningkatan/fitur menjadi \"Mode ini ditujukan/dirancang/dibuat\"'];\n  }\n  for (const mode of extractTypedEntities(sourceText).modes) {\n    const key = escapeRegExp(mode);\n    if (new RegExp(`\\\\bmode ${key} ${relation}\\\\b`, 'i').test(visible) && !new RegExp(`\\\\bmode ${key} ${relation}\\\\b`, 'i').test(source)) {\n      return [`subjek relasi berubah: Mode ${mode} tidak boleh diberi relasi baru`];\n    }\n  }\n  return [];\n}\n\n"""
          assert anchor in s
          s=s.replace(anchor,helper+anchor,1)
          r("  errors.push(...validateComparisonCompleteness({ ...result, slides }, sourceText));\n\n  return {", "  errors.push(...validateComparisonCompleteness({ ...result, slides }, sourceText));\n  errors.push(...validateModeSubjectShift({ ...result, slides }, sourceText));\n\n  return {")
          r("- Contoh penggunaan tetap ditulis sebagai contoh penggunaan; jangan diubah menjadi fitur, kemampuan, manfaat, dukungan, atau integrasi baru.\\n", "- Contoh penggunaan tetap ditulis sebagai contoh penggunaan; jangan diubah menjadi fitur, kemampuan, manfaat, dukungan, atau integrasi baru.\\n- Jangan mengubah contoh/konteks menjadi relasi baru seperti dibuat untuk, dirancang untuk, cocok untuk, mendukung, ditujukan untuk, atau bertujuan untuk kecuali relasi itu memang tertulis pada subjek yang sama.\\n- Jika TEXT_INPUT menyebut \"peningkatan kecepatan ini ditujukan...\", jangan ubah subjeknya menjadi \"Mode ini ditujukan...\".\\n")
          r("  validateEntityContext,\n  validateComparisonCompleteness,", "  validateEntityContext,\n  validateComparisonCompleteness,\n  validateModeSubjectShift,")
          p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > test/text-input-final-grounding-regression.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const c = require('../src/services/textInputComposer');
          const source = 'OpenAI memperkenalkan mode baru bernama Ultrafast untuk GPT-5.6 Sol. Peningkatan kecepatan ini ditujukan untuk membuat model lebih responsif saat coding, riset, dan agen AI. GPT-5.6 Sol dirancang untuk keamanan siber dan sains.';
          test('rejects vague title and relation drift', () => {
            assert.equal(c.genericSlideTitle('Kecepatan Utama'), true);
            const bad = { caption:'Mode ini ditujukan untuk coding dan riset', slides:[{title:'Mode Ultrafast Dirancang untuk Coding',body:'',points:[]}] };
            assert.match(c.validateModeSubjectShift(bad, source).join(' '), /subjek relasi berubah/i);
            const modifiers = c.validateGroundedModifiers({caption:'',slides:[{title:'Detail',body:'',points:['Cocok untuk tugas kompleks','Mendukung penggunaan komputer']}]}, source);
            assert.ok(modifiers.includes('cocok'));
            assert.ok(modifiers.includes('mendukung'));
            assert.ok(!modifiers.includes('dirancang'));
          });
          EOF
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --test test/text-input-final-grounding-regression.test.js test/text-input-context-render-regression.test.js test/text-input-composer.test.js test/text-input-fresh-retry.test.js test/auto-source-patch.test.js test/background-state.test.js
      - name: Commit clean result
        run: |
          git config user.name "Riyan3w"
          git config user.email "129081548+riyan3110@users.noreply.github.com"
          git rm .github/workflows/temp-text-grounding-final.yml
          git add src/services/textInputComposer.js test/text-input-final-grounding-regression.test.js
          git commit -m "Keep Generate from Text faithful to input relations"
          git push origin HEAD:agent/text-grounding-final
