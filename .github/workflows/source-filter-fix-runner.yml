name: Source filter fix runner
on:
  push:
    branches:
      - fix/source-filter-ai-identity-semantic-point
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Capture existing main-equivalent failures
        run: npm test > baseline.log 2>&1 || true
      - name: Apply focused patch
        run: |
          sed -i "/assert export_old in text/d" scripts/fix_source_filter_regressions.py
          python3 scripts/fix_source_filter_regressions.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/sourceFilter.js')
          s = p.read_text()
          marker = "  MAX_VERIFY_ATTEMPTS\n};"
          replacement = "  dropUnsupportedPointClaims,\n  MAX_VERIFY_ATTEMPTS\n};"
          assert marker in s, 'module export marker missing'
          p.write_text(s.replace(marker, replacement, 1))
          PY
      - run: npm run check
      - name: Run patched full suite
        run: npm test > patched.log 2>&1 || true
      - name: Prove no new full-suite failures
        run: |
          grep '^not ok' baseline.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > baseline-failures.txt || true
          grep '^not ok' patched.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > patched-failures.txt || true
          echo 'Baseline failures:'
          cat baseline-failures.txt
          echo 'Patched failures:'
          cat patched-failures.txt
          diff -u baseline-failures.txt patched-failures.txt
      - name: Run focused source-filter regression tests
        run: node --test test/source-filter.test.js test/source-filter-generation.test.js
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: source-filter-baseline-comparison
          path: |
            baseline.log
            patched.log
            baseline-failures.txt
            patched-failures.txt
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/sourceFilter.js test/source-filter.test.js
          git commit -m "fix: stabilize source semantic validation"
          git push
