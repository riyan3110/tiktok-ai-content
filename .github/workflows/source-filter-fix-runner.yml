name: Source filter fix runner
on:
  push:
    branches:
      - fix/source-filter-ai-identity-semantic-point
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused patch
        run: |
          sed -i "/assert export_old in text/d" scripts/fix_source_filter_regressions.py
          python3 scripts/fix_source_filter_regressions.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/sourceFilter.js')
          s = p.read_text()
          marker = "  MAX_VERIFY_ATTEMPTS\n};"
          replacement = "  dropUnsupportedPointClaims,\n  MAX_VERIFY_ATTEMPTS\n};"
          assert marker in s, 'module export marker missing'
          p.write_text(s.replace(marker, replacement, 1))
          PY
      - run: npm install
      - run: npm run check
      - name: Run full tests
        id: tests
        continue-on-error: true
        run: npm test > source-filter-test.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: source-filter-test-log
          path: source-filter-test.log
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/sourceFilter.js test/source-filter.test.js
          git commit -m "fix: stabilize source semantic validation"
          git push
