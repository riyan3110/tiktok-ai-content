name: Temp stateful verifier fix

on:
  push:
    branches:
      - fix/source-verifier-stateful-repair

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-verifier-stateful-repair
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/apply-stateful-verifier-fix.py
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/sourceFilter.js test/source-filter-production-regressions.test.js
          git commit -m "fix: make source verifier repairs stateful [skip ci]"
          git push origin HEAD:fix/source-verifier-stateful-repair
