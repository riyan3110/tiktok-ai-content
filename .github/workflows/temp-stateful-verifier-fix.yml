name: Temp stateful verifier fix

on:
  push:
    branches: [fix/source-verifier-stateful-repair]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-verifier-stateful-repair
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply focused repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/services/sourceFilter.js')
          text = source_path.read_text()

          old = "function verifierPrompt({ base, bank, topic, format, errors = [] }) {\n  return `Anda adalah FILTER/VERIFIER fakta untuk carousel Indonesia. Anda BUKAN pembuat struktur carousel baru."
          new = """function verifierPrompt({ base, draft = base, bank, topic, format, errors = [] }) {
            const requiredClaimFields = (draft?.slides || []).flatMap((slide, slideIndex) =>
              slideFields(slide, slideIndex)
                .filter(field => field.value && requiresEvidence(field.value, slide.section, field.kind))
                .map(field => ({ field: field.key, text: field.value }))
            );
            return `Anda adalah FILTER/VERIFIER fakta untuk carousel Indonesia. Anda BUKAN pembuat struktur carousel baru."""
          assert old in text, 'verifierPrompt signature block not found'
          text = text.replace(old, new, 1)

          old = 'FORMAT: ${JSON.stringify(format || \'\')}\n\nATURAN WAJIB:'
          new = """FORMAT: ${JSON.stringify(format || '')}

FIELD FAKTUAL CURRENT_DRAFT YANG WAJIB PUNYA CLAIM JIKA COPY-NYA DIPERTAHANKAN:
${JSON.stringify(requiredClaimFields)}

ATURAN WAJIB:"""
          assert old in text, 'format marker not found'
          text = text.replace(old, new, 1)

          old = '- Setiap slide wajib tetap memiliki title dan minimal body atau points yang bermakna.\n- Title, body, dan points dalam satu slide harus saling melengkapi. Jangan mengulang kalimat atau ide yang sama di field berbeda.'
          new = """- Setiap slide wajib tetap memiliki title dan minimal body atau points yang bermakna.
- BATAS COPY FINAL: title maksimal 12 kata; body maksimal 24 kata; points maksimal 3 item; tiap point maksimal 7 kata.
- Jika error sebelumnya menyebut body/title/point terlalu panjang, ringkas field itu pada percobaan ini tanpa menambah fakta baru.
- Jika error sebelumnya menyebut `slide:X:... klaim faktual tidak memiliki evidence`, wajib lakukan salah satu: tambahkan claim untuk FIELD PERSIS itu memakai satu evidence FACT_BANK yang benar-benar mendukung, atau ubah field tersebut menjadi copy non-faktual yang akurat. Jangan kembalikan field faktual yang sama tanpa claim.
- Title, body, dan points dalam satu slide harus saling melengkapi. Jangan mengulang kalimat atau ide yang sama di field berbeda."""
          assert old in text, 'slide rule marker not found'
          text = text.replace(old, new, 1)

          old = 'ORIGINAL_CONTENT:\n${JSON.stringify(base)}'
          new = """ORIGINAL_STRUCTURE (jumlah, urutan, dan section tidak boleh berubah):
${JSON.stringify((base?.slides || []).map(slide => ({ section: slide.section })))}

CURRENT_DRAFT (perbaiki versi ini; jangan kembali mengulang versi awal):
${JSON.stringify(draft)}"""
          assert old in text, 'original content marker not found'
          text = text.replace(old, new, 1)

          old = '  let errors = [];\n  for (let attempt = 1; attempt <= MAX_VERIFY_ATTEMPTS; attempt += 1) {'
          new = '  let errors = [];\n  let draft = base;\n  for (let attempt = 1; attempt <= MAX_VERIFY_ATTEMPTS; attempt += 1) {'
          assert old in text, 'loop start not found'
          text = text.replace(old, new, 1)

          old = 'verifierPrompt({ base, bank, topic, format: options.contentFormat, errors })'
          new = 'verifierPrompt({ base, draft, bank, topic, format: options.contentFormat, errors })'
          assert old in text, 'verifier prompt call not found'
          text = text.replace(old, new, 1)

          old = """    if (!checked.errors.length) return checked.content;
            errors = checked.errors;
          }"""
          new = """    if (!checked.errors.length) return checked.content;
            errors = checked.errors;
            draft = {
              ...base,
              slides: Array.isArray(candidate.slides) ? candidate.slides : draft.slides
            };
          }"""
          assert old in text, 'retry tail not found'
          text = text.replace(old, new, 1)
          source_path.write_text(text)

          test_path = Path('test/source-filter-production-regressions.test.js')
          tests = test_path.read_text()
          marker = "test('retry verifier memperbaiki CURRENT_DRAFT dan tidak mengulang draft awal'"
          assert marker not in tests, 'test already present'
          tests += r'''

test('retry verifier memperbaiki CURRENT_DRAFT dan tidak mengulang draft awal', async () => {
  const title = 'Menurut Survei Strategi AI Perusahaan 2026';
  const longBody = 'Cek rincian survei ini secara lengkap sebelum menarik kesimpulan agar konteks temuan metode responden tujuan penerapan batasan strategi perusahaan dan dampaknya tetap dipahami dengan benar oleh setiap pembaca.';
  const baseSlides = [
    { section: 'PEMBUKA', title, body: 'Cek konteks survei sebelum menyimpulkan.', points: [] },
    { section: 'POIN 1', title: 'Cek Temuan Utama', body: 'Bandingkan konteks sumber sebelum menyimpulkan.', points: [] },
    { section: 'PENUTUP', title: 'Baca Detail Survei', body: 'Simpan bagian yang paling relevan.', points: [] }
  ];
  const content = {
    async generateContent() { return baseContent(baseSlides); },
    validateContent(value) {
      const errors = [];
      value.slides.forEach((slide, index) => {
        if (String(slide.body || '').trim().split(/\s+/).filter(Boolean).length > 24) {
          errors.push(`Slide ${index + 1}: body maksimal 24 kata.`);
        }
      });
      return errors;
    }
  };
  const evidence = 'The 2026 Enterprise AI Strategy Survey reports company plans for artificial intelligence.';
  const firstDraft = [
    { section: 'PEMBUKA', title, body: longBody, points: [], claims: [] },
    { section: 'POIN 1', title: 'Cek Temuan Utama', body: 'Bandingkan konteks sumber sebelum menyimpulkan.', points: [], claims: [] },
    { section: 'PENUTUP', title: 'Baca Detail Survei', body: 'Simpan bagian yang paling relevan.', points: [], claims: [] }
  ];
  const repairedDraft = [
    {
      section: 'PEMBUKA', title, body: 'Cek rincian survei sebelum menarik kesimpulan.', points: [],
      claims: [{ field: 'slide:0:title', text: title, sourceId: 'source-1', evidence }]
    },
    { section: 'POIN 1', title: 'Cek Temuan Utama', body: 'Bandingkan konteks sumber sebelum menyimpulkan.', points: [], claims: [] },
    { section: 'PENUTUP', title: 'Baca Detail Survei', body: 'Simpan bagian yang paling relevan.', points: [], claims: [] }
  ];
  let calls = 0;
  const client = {
    chat: { completions: { async create({ messages }) {
      calls += 1;
      const prompt = messages[1].content;
      if (calls === 1) {
        assert.match(prompt, /FIELD FAKTUAL CURRENT_DRAFT/);
        assert.match(prompt, /slide:0:title/);
        return { choices: [{ message: { content: JSON.stringify({ slides: firstDraft }) } }] };
      }
      assert.match(prompt, /CURRENT_DRAFT/);
      assert.ok(prompt.includes(longBody));
      assert.match(prompt, /body maksimal 24 kata/);
      assert.match(prompt, /slide:0:title: klaim faktual tidak memiliki evidence/);
      return { choices: [{ message: { content: JSON.stringify({ slides: repairedDraft }) } }] };
    } } }
  };
  const result = await generateFilteredContent({
    content,
    options: { topicSource: 'manual', requestedTopic: title, contentFormat: 'Listicle' },
    sources: [{ text: evidence }],
    client
  });
  assert.equal(calls, 2);
  assert.equal(result.verificationStatus, 'source_based');
  assert.equal(result.slides[0].body, 'Cek rincian survei sebelum menarik kesimpulan.');
  assert.equal(result.slides[0].claims[0].field, 'slide:0:title');
});
'''
          test_path.write_text(tests)
          PY
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/sourceFilter.js test/source-filter-production-regressions.test.js
          git commit -m "fix: make source verifier repairs stateful [skip ci]"
          git push origin HEAD:fix/source-verifier-stateful-repair
