name: Temp stateful verifier fix

on:
  push:
    branches:
      - fix/source-verifier-stateful-repair

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: git diff --check
