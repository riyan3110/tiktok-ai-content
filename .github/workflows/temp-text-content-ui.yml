name: Temp Text Content UI
on:
  push:
    branches: [fix/text-content-responsive-ui]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/text-content-responsive-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply UI patch
        run: python3 scripts/patch-text-content-ui.py
      - name: Verify requested UI changes
        run: |
          grep -Fq '<h1>Text Content</h1>' public/index.html
          grep -Fq '/* Text Content responsive layout */' public/style.css
          ! grep -Fq 'Buat konten yang<br><em>layak dihentikan.</em>' public/index.html
      - name: Persist branch patch
        run: |
          git config user.name 'Riyan3w'
          git config user.email '129081548+riyan3110@users.noreply.github.com'
          git add public/index.html public/style.css
          git commit -m 'fix: tidy Text Content layout on desktop and mobile'
          git push origin HEAD:fix/text-content-responsive-ui
      - name: Install dependencies
        run: npm install
      - name: Run check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Diff check
        run: git diff --check HEAD~1 HEAD
