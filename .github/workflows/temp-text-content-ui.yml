name: Temp Text Content UI
on:
  push:
    branches: [fix/text-content-responsive-ui]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/text-content-responsive-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update stale heading assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = 'Heading Content Studio lama harus tetap tersedia'
          matches = []
          for path in Path('test').rglob('*.js'):
              lines = path.read_text().splitlines()
              changed = False
              output = []
              for line in lines:
                  if needle in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      output.append(indent + "assert.match(index, /<h1>Text Content<\\/h1>/, 'Heading Text Content harus tersedia');")
                      changed = True
                  else:
                      output.append(line)
              if changed:
                  path.write_text('\n'.join(output) + '\n')
                  matches.append(str(path))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one stale heading assertion, found {matches}')
          print('Updated:', matches[0])
          PY
      - name: Verify requested UI changes
        run: |
          grep -Fq '<h1>Text Content</h1>' public/index.html
          grep -Fq '/* Text Content responsive layout */' public/style.css
          ! grep -Fq 'Buat konten yang<br><em>layak dihentikan.</em>' public/index.html
      - name: Persist test update
        run: |
          git config user.name 'Riyan3w'
          git config user.email '129081548+riyan3110@users.noreply.github.com'
          git add test
          if ! git diff --cached --quiet; then
            git commit -m 'test: expect Text Content heading'
            git push origin HEAD:fix/text-content-responsive-ui
          fi
      - name: Install dependencies
        run: npm install
      - name: Run check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Diff check
        run: git diff --check
