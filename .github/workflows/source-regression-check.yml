name: Source regression verification

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run check
      - name: Run tests and capture output
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          echo "$code" > test-exit-code.txt
          cat test-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-regression-test-output
          path: |
            test-output.txt
            test-exit-code.txt
      - name: Fail if tests failed
        run: test "$(cat test-exit-code.txt)" = "0"
