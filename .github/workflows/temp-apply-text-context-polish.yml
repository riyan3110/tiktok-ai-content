name: temp-apply-text-context-polish
on:
  push:
    branches: [agent/text-context-polish-clean]
permissions:
  contents: write
jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 test/.temp-text-context-patch.py
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --test test/text-input-context-render-regression.test.js
      - run: node --test test/text-input-composer.test.js
      - run: node --test test/text-input-fresh-retry.test.js
      - run: node --test test/auto-source-patch.test.js
      - run: node --test test/background-state.test.js
      - name: Commit clean patch
        run: |
          git config user.name 'Riyan3w'
          git config user.email '129081548+riyan3110@users.noreply.github.com'
          git rm test/.temp-text-context-patch.py .github/workflows/temp-apply-text-context-polish.yml
          git add src/services/images.js src/services/textInputComposer.js test/text-input-context-render-regression.test.js
          git commit -m 'Polish Generate from Text context and hook layout'
          git push origin HEAD:agent/text-context-polish-clean
