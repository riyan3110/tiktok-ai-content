name: Temp source topic relevance

on:
  push:
    branches:
      - fix/source-topic-relevance

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-topic-relevance
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/apply-source-topic-relevance-fix.py
      - name: Persist branch-only code patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/content.js src/services/sourceFilter.js test/source-filter-production-regressions.test.js
          git commit -m "fix: keep source content on the manual topic [skip ci]"
          git push origin HEAD:fix/source-topic-relevance
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: git diff --check
