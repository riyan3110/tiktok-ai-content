name: Content Studio media refresh verification
on:
  push:
    branches:
      - fix/content-studio-stable-media-preview
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
