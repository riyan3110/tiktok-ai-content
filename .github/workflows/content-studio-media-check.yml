name: Content Studio media refresh verification
on:
  push:
    branches:
      - fix/content-studio-stable-media-preview
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test > test.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: content-studio-test-log
          path: test.log
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
