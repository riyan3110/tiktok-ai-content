name: temp-text-input-generate

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Text input composer
        run: node --test test/text-input-composer.test.js
      - name: Manual text route and URL isolation
        run: node --test test/auto-source-patch.test.js
      - name: Pakai URL regressions
        run: node --test --test-concurrency=1 test/pakai-url-*.test.js
      - name: Auto Source regressions
        run: node --test --test-concurrency=1 test/auto-source-*.test.js
      - name: App API tests
        run: node --test test/app.test.js
