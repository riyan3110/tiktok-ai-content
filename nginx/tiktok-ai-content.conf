server {
    listen 80;
    server_name example.com;
    client_max_body_size 10m;

    # TikTok photo drafts pull carousel JPEGs from these public URLs.
    # Serve them straight from disk instead of proxying through Node/Express so
    # external downloaders do not compete with the app process or its event loop.
    location ^~ /generated/ {
        root /var/www/tiktok-ai-content/public;
        sendfile on;
        tcp_nopush on;
        etag on;
        open_file_cache max=1000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 1;
        open_file_cache_errors off;
        add_header Cache-Control "public, max-age=300, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Source-backed generation can legitimately take longer than Nginx's
        # 60s proxy defaults while the AI validates and rewrites the carousel.
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
