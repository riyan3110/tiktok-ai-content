# Include this file inside the HTTPS server block for aiadslabs.xyz.
# Example:
#   include /var/www/tiktok-ai-content/nginx/generated-location.conf;
#
# TikTok photo uploads use PULL_FROM_URL, so keep /generated/*.jpg public and
# serve those files directly from disk instead of proxying them to Express.
location ^~ /generated/ {
    auth_basic off;
    root /var/www/tiktok-ai-content/public;
    sendfile on;
    tcp_nopush on;
    etag on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 1;
    open_file_cache_errors off;
    add_header Cache-Control "public, max-age=300, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
