<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Ads Lab</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>CONTENT STUDIO</small><h1>AI Ads Lab</h1><p>Buat carousel TikTok untuk berbagai kategori, lalu unggah sebagai draft.</p></div><div class="tiktok-connection"><a id="tiktok-connect" class="outline" href="/auth/tiktok">Hubungkan TikTok</a><a id="tiktok-reconnect" class="reconnect hidden" href="/auth/tiktok">Hubungkan ulang</a><span id="connection-message" role="status"></span></div></header><section class="actions"><fieldset class="topic-source"><legend>Sumber Topik</legend><label><input type="radio" name="topic-source" value="manual"> Topik manual</label><label><input type="radio" name="topic-source" value="ai" checked> Otomatis dari AI</label><label><input type="radio" name="topic-source" value="trending"> Topik trending</label></fieldset><div class="option-grid"><label>Kategori Konten<select id="content-category"><option>Iklan &amp; UGC</option><option>Tutorial AI</option><option>Tips bisnis</option><option>Produktivitas</option><option>Fakta unik</option><option>Edukasi teknologi</option><option>Motivasi</option><option>Konten kreator</option><option>Custom</option></select></label><label>Format Konten<select id="content-format"><option>Tutorial langkah</option><option>Listicle</option><option>Fakta singkat</option><option>Masalah dan solusi</option><option>Before-after</option><option>Tips cepat</option></select></label></div><label id="custom-category-field" class="hidden">Kategori sendiri<input id="custom-category" type="text" maxlength="80" placeholder="Contoh: crypto, game, kesehatan, otomotif, kuliner"></label><label id="manual-topic-field" class="hidden">Topik yang ingin dibuat<input id="manual-topic" type="text" placeholder="Contoh: Tutorial membuat video iklan produk sepatu"></label><div class="generate-row"><button id="generate">✦ Buat konten baru</button><span id="message" role="status"></span></div></section><section id="editor" class="hidden"><h2>Preview terbaru</h2><div id="slides" class="slides"></div><label>Caption<textarea id="caption" rows="5"></textarea></label><button id="upload">Upload draft ke TikTok</button><p id="status"></p></section><section><div class="history-heading"><h2>Riwayat</h2><button id="delete-all" class="danger">Hapus semua riwayat</button></div><div id="history"></div></section><footer><span>© AI Ads Lab</span><nav aria-label="Legal"><a href="/terms">Terms of Service</a><a href="/privacy">Privacy Policy</a></nav></footer></main><script src="/app.js"></script></body></html>
